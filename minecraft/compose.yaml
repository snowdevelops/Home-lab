services:
  bedrock:
    image: itzg/minecraft-bedrock-server:latest
    container_name: minecraft-bedrock
    restart: unless-stopped
    # Host networking: LAN discovery (UDP 7551) is broadcast and doesn't cross
    # Docker's bridge. BDS advertises the host's addresses; no port mappings.
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      TZ: "America/Sao_Paulo"
      UID: "1000"
      GID: "1000"
      SERVER_NAME: "Snow Homelab"
      GAMEMODE: "survival"
      DIFFICULTY: "hard"
      ONLINE_MODE: "true"
      ALLOW_LIST: "true"
      # Operators by XUID (DaSnowV5); gamertags would need a mcprofile.io lookup at every start.
      OPS: "2535406535789621"
      # Set explicitly: the image only rewrites server.properties keys it has an env var
      # for, so merely deleting TRANSPORT leaves a previous "raknet" stuck in ./data.
      # RakNet is not viable on BDS 1.26.52.3 (NetherNet is the only transport).
      TRANSPORT: "nethernet"
      # NetherNet: TCP 19132 signaling + one UDP port per player.
      # Range must hold at least max-players (default 10) ports.
      # Plain range only. The ip:ext:int form made BDS 1.26.52.3 skip the TCP
      # 19132 listener (no "Accepting clients" line), so don't use it here.
      SERVER_UDP_PORTS: "19140-19155"
    # The image's default check (mc-monitor, UDP RakNet ping) stays "healthy" even
    # when BDS silently fails to open the NetherNet TCP 19132 listener. Test the
    # real signaling endpoint instead. Docker only marks unhealthy; it won't restart.
    healthcheck:
      test: ["CMD", "curl", "-fs", "-m", "4", "http://127.0.0.1:19132/v1/join"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./data:/data

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: minecraft-playit
    restart: unless-stopped
    # Host networking (as in playit's docs) so the tunnel can reach 127.0.0.1:19132.
    network_mode: host
    # SECRET_KEY lives in ./playit/playit.env (gitignored, mode 600), never in this file.
    env_file:
      - ./playit/playit.env
